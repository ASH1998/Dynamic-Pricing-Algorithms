[project]
name = "neuroprice"
version = "0.1.0"
description = "Dynamic Pricing Engine using Reinforcement Learning and Causal Inference"
authors = [
    {name = "Dynamic Pricing Team", email = "team@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3.0.0",
    "pandas>=2.0,<4.0.0",
    "pydantic>=2.0,<3.0.0",
    "pyyaml>=6.0,<7.0.0",
    "gymnasium>=0.29,<2.0.0",
    "stable-baselines3>=2.0,<3.0.0",
    "econml>=0.15.0,<1.0.0",
    "scikit-learn>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["neuroprice"]
