[project]
name = "neuroprice"
version = "0.1.0"
description = "Dynamic Pricing Engine using Reinforcement Learning and Causal Inference"
authors = [
    {name = "Dynamic Pricing Team",email = "team@example.com"}
]
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "numpy (>=2.4.2,<3.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "gymnasium (>=1.2.3,<2.0.0)",
    "stable-baselines3 (>=2.7.1,<3.0.0)",
    "econml (>=0.15.0,<1.0.0)",
    "scikit-learn (>=1.6.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
